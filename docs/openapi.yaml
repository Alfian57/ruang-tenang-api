            $ref: '#/definitions/dto.UserMoodDTO'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Get latest mood
      tags:
      - Mood
  /user-moods/stats:
