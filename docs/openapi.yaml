      security:
      - BearerAuth: []
      summary: Update article category
      tags:
      - Admin
  /admin/articles:
    get:
      description: Get paginated list of all articles with optional filtering (admin
        only)
      parameters:
      - description: Filter by category ID
        in: query
        name: category_id
        type: integer
      - description: Search by title
        in: query
        name: search
        type: string
      - description: Filter by status (published, draft, blocked)
        in: query
        name: status
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 10
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.PaginatedResponse'
      security:
      - BearerAuth: []
      summary: Get all articles for admin
      tags:
      - Admin
