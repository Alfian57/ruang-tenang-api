        schema:
          $ref: '#/definitions/dto.CreateArticleCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Create article category
      tags:
      - Admin
  /admin/article-categories/{id}:
    delete:
